<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Header Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding: 40px 20px; }
    h1 { text-align: center; font-size: 1.6rem; color: #58a6ff; margin-bottom: 8px; letter-spacing: 1px; }
    .subtitle { text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 30px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    button { padding: 10px 22px; background: #238636; border: none; border-radius: 8px; color: #fff; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2ea043; }
    button:disabled { background: #3d4451; cursor: not-allowed; }
    button.secondary { background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
    button.secondary:hover { background: #30363d; }
    .drop { background: #161b22; border: 2px dashed #30363d; border-radius: 10px; padding: 16px; transition: border-color 0.2s, background 0.2s; }
    .drop.hover { border-color: #58a6ff; background: #13233a; }
    textarea { width: 100%; min-height: 220px; resize: vertical; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; padding: 12px 14px; font-family: Consolas, monospace; font-size: 0.8rem; outline: none; }
    textarea:focus { border-color: #58a6ff; }
    .drop-hint { color: #8b949e; font-size: 0.8rem; margin: 10px 2px 0; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .controls label { color: #8b949e; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .controls .grow { flex: 1; }
    .file-chip { background: #1f4068; color: #58a6ff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
    .spinner { text-align: center; color: #8b949e; font-size: 0.9rem; padding: 40px; }
    .results { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .card-title { font-weight: 700; font-size: 1rem; color: #58a6ff; }
    .sub-title { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; }
    .sub-title:first-child { margin-top: 0; }
    .pass, .ok { color: #56d364; font-weight: 700; }
    .fail, .high { color: #f85149; font-weight: 700; }
    .warn, .medium { color: #e3b341; font-weight: 700; }
    .low { color: #79c0ff; font-weight: 700; }
    .info, .muted { color: #8b949e; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-row { display: flex; flex-direction: column; background: #21262d; border-radius: 6px; padding: 8px 12px; min-width: 0; }
    .info-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; margin-bottom: 2px; }
    .info-value { font-size: 0.88rem; color: #e6edf3; word-break: break-word; }
    .full-width { grid-column: 1 / -1; }
    .record-box { background: #21262d; border-radius: 6px; padding: 10px 12px; font-size: 0.78rem; color: #8b949e; word-break: break-all; font-family: monospace; margin-top: 8px; }
    .summary-bar { display: flex; gap: 10px; flex-wrap: wrap; }
    .summary-pill { padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .pill-pass { background: #1a3a2a; color: #56d364; }
    .pill-fail { background: #3a1a1a; color: #f85149; }
    .pill-warn { background: #3a2d1a; color: #e3b341; }
    .pill-info { background: #1f2a3a; color: #79c0ff; }
    .pill-muted { background: #21262d; color: #8b949e; }
    .verdict { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .verdict-badge { font-size: 1.25rem; font-weight: 700; padding: 8px 18px; border-radius: 8px; }
    .verdict-high { background: #3a1a1a; color: #f85149; }
    .verdict-medium { background: #3a2d1a; color: #e3b341; }
    .verdict-ok { background: #1a3a2a; color: #56d364; }
    .flag { background: #21262d; border-left: 4px solid #8b949e; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; }
    .flag.high { border-color: #f85149; } .flag.medium { border-color: #e3b341; } .flag.low { border-color: #79c0ff; }
    .flag-title { font-weight: 600; font-size: 0.9rem; }
    .flag-detail { color: #8b949e; font-size: 0.82rem; margin-top: 3px; word-break: break-word; }
    .flag-level { font-size: 0.68rem; text-transform: uppercase; margin-right: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; color: #8b949e; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid #30363d; }
    td { padding: 8px; border-bottom: 1px solid #21262d; vertical-align: top; word-break: break-word; }
    tr.sender-row td { background: #13233a; }
    .tag { display: inline-block; font-size: 0.68rem; padding: 1px 7px; border-radius: 10px; margin: 2px 4px 0 0; background: #21262d; color: #8b949e; }
    .tag.tls { background: #1a3a2a; color: #56d364; } .tag.notls { background: #3a2d1a; color: #e3b341; }
    .tag.sender { background: #1f4068; color: #58a6ff; } .tag.auth { background: #2d1f3a; color: #d2a8ff; }
    .mono { font-family: Consolas, monospace; font-size: 0.78rem; }
    .auth-row { display: grid; grid-template-columns: 90px 110px 1fr; gap: 10px; background: #21262d; border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 0.82rem; align-items: start; }
    .auth-method { font-weight: 700; text-transform: uppercase; color: #e6edf3; }
    .notes { margin-top: 4px; color: #8b949e; font-size: 0.78rem; }
    .notes li { margin-left: 18px; }
    .bimi { display: flex; gap: 18px; align-items: flex-start; background: #21262d; border-radius: 8px; padding: 14px; }
    .bimi img { width: 96px; height: 96px; border-radius: 50%; background: #fff; padding: 6px; object-fit: contain; flex-shrink: 0; }
    .bimi .no-logo { width: 96px; height: 96px; border-radius: 50%; background: #161b22; border: 1px dashed #30363d; display: flex; align-items: center; justify-content: center; color: #8b949e; font-size: 0.7rem; text-align: center; flex-shrink: 0; }
    .check-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .check { background: #21262d; border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; display: flex; gap: 6px; align-items: center; }
    .check.ok { color: #56d364; } .check.bad { color: #f85149; }
    .delay-bar { height: 4px; border-radius: 2px; background: #58a6ff; margin-top: 4px; min-width: 2px; }
    .delay-bar.slow { background: #e3b341; } .delay-bar.neg { background: #f85149; }
    .rbl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .rbl-item { background: #21262d; border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; }
    details summary { cursor: pointer; color: #58a6ff; font-weight: 700; }
    .filter { width: 100%; margin: 12px 0; padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; outline: none; }
    .error { color: #f85149; }
    @media (max-width: 700px) { .info-grid, .rbl-grid, .check-grid { grid-template-columns: 1fr; } .auth-row { grid-template-columns: 1fr; } table { font-size: 0.72rem; } }
  </style>
</head>
<body>
  <h1>📨 Email Header Analyzer</h1>
  <p class="subtitle">Paste a full email header, or drop a .eml / .msg file - it's analyzed locally on this machine</p>

  <div class="wrap">
    <div class="drop" id="drop">
      <textarea id="headers" spellcheck="false" placeholder="Paste the full email header here...&#10;&#10;Outlook: open the message > File > Properties > Internet headers&#10;Gmail: open the message > ⋮ > Show original&#10;&#10;...or drag and drop a .eml or .msg file onto this box."></textarea>
      <p class="drop-hint">Tip: Ctrl+Enter to analyze. Dropping a full .eml file also lets DKIM verify the message body.</p>
      <div class="controls">
        <button id="analyzeBtn">Analyze</button>
        <button class="secondary" id="fileBtn">Choose file…</button>
        <button class="secondary" id="clearBtn">Clear</button>
        <input type="file" id="fileInput" accept=".eml,.msg,.txt,message/rfc822" hidden>
        <span id="fileChip"></span>
        <span class="grow"></span>
        <label title="Looks up DKIM keys, SPF, DMARC, BIMI, reverse DNS and blocklists. The domains in the email can see these DNS lookups."><input type="checkbox" id="live" checked> Live DNS checks</label>
      </div>
    </div>
    <div id="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
